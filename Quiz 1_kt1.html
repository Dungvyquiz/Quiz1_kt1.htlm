<script type="text/javascript">
        var gk_isXlsx = false;
        var gk_xlsxFileLookup = {};
        var gk_fileData = {};
        function filledCell(cell) {
          return cell !== '' && cell != null;
        }
        function loadFileData(filename) {
        if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
            try {
                var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
                var firstSheetName = workbook.SheetNames[0];
                var worksheet = workbook.Sheets[firstSheetName];

                // Convert sheet to JSON to filter blank rows
                var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
                // Filter out blank rows (rows where all cells are empty, null, or undefined)
                var filteredData = jsonData.filter(row => row.some(filledCell));

                // Heuristic to find the header row by ignoring rows with fewer filled cells than the next row
                var headerRowIndex = filteredData.findIndex((row, index) =>
                  row.filter(filledCell).length >= filteredData[index + 1]?.filter(filledCell).length
                );
                // Fallback
                if (headerRowIndex === -1 || headerRowIndex > 25) {
                  headerRowIndex = 0;
                }

                // Convert filtered JSON back to CSV
                var csv = XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex)); // Create a new sheet from filtered array of arrays
                csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
                return csv;
            } catch (e) {
                console.error(e);
                return "";
            }
        }
        return gk_fileData[filename] || "";
        }

                type: 'multiple_choice',
                question: 'Thờ phượng và kính mến Thiên Chúa trên hết mọi sự có nghĩa là:',
                options: [
                    'Đặt Thiên Chúa trên hết mọi sự và ưu tiên Ngài trong mọi suy nghĩ, lời nói, hành động',
                    'Chỉ cầu nguyện khi gặp khó khăn',
                    'Tham gia mọi hoạt động xã hội để nổi bật',
                    'Tập trung vào việc học tập và công việc'
                ],
                correct: 'Đặt Thiên Chúa trên hết mọi sự và ưu tiên Ngài trong mọi suy nghĩ, lời nói, hành động',
                explanation: 'Thờ phượng là đặt Thiên Chúa lên trên hết (Bài 24).',
                bloom: 'Applying',
                cefr: 'B2'
            },
            {
                id: 39,
                part: 'C',
                type: 'bible_citation',
                question: 'Đoạn Kinh Thánh nào nói về việc yêu thương đồng loại như chính mình?',
                options: [
                    'Lv 19,11-18',
                    'St 1,26-28',
                    'Xh 19,3-8',
                    'Ed 37,11-14'
                ],
                correct: 'Lv 19,11-18',
                explanation: 'Lv 19,11-18 dạy yêu thương đồng loại như chính mình (Bài 27).',
                bloom: 'Reasoning',
                cefr: 'B1'
            },
            {
                id: 40,
                part: 'C',
                type: 'multiple_choice',
                question: 'Trong một tình huống bạn bè rủ rê nói dối để được lợi, bạn sẽ áp dụng bài học nào từ Kinh Thánh?',
                options: [
                    'Noi gương Áp-ra-ham, luôn tin cậy Chúa và sống ngay thẳng',
                    'Noi gương Mô-sê, dẫn dắt bạn bè ra khỏi cám dỗ',
                    'Noi gương Sa-mu-en, lắng nghe tiếng Chúa và từ chối nói dối',
                    'Câu a và c đúng'
                ],
                correct: 'Câu a và c đúng',
                explanation: 'Cả Áp-ra-ham và Sa-mu-en đều là gương sống ngay thẳng và lắng nghe Chúa (Bài 9, 11).',
                bloom: 'Situational',
                cefr: 'B2'
            }
        ];

        // Shuffle questions for Part A
        const partAQuestions = questionBank.filter(q => q.part === 'A').sort(() => Math.random() - 0.5);
        const partBQuestions = questionBank.filter(q => q.part === 'B');
        const partCQuestions = questionBank.filter(q => q.part === 'C');
        const questions = [...partAQuestions, ...partBQuestions, ...partCQuestions];

        let currentQuestionIndex = 0;
        let userAnswers = new Array(questions.length).fill(null);
        let timerInterval;
        let timeLeft = 45 * 60; // 45 minutes in seconds

        function startQuiz() {
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('questionScreen').style.display = 'block';
            startTimer();
            showQuestion();
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                timeLeft--;
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                document.getElementById('timer').textContent = `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    submitQuiz();
                }
            }, 1000);
        }

        function showQuestion() {
            const question = questions[currentQuestionIndex];
            document.getElementById('questionText').innerHTML = `<strong>Câu ${currentQuestionIndex + 1}:</strong> ${question.question}`;
            const optionsDiv = document.getElementById('options');
            optionsDiv.innerHTML = '';

            // Show scripture for Part B
            if (question.part === 'B') {
                document.getElementById('scriptureText').style.display = 'block';
                document.getElementById('scriptureText').innerHTML = `<strong>Đoạn Lời Chúa số 1, Bài 1:</strong> ${question.scripture}`;
            } else {
                document.getElementById('scriptureText').style.display = 'none';
            }

            // Display options
            question.options.forEach((option, index) => {
                const label = document.createElement('label');
                label.innerHTML = `
                    <input type="radio" name="option" value="${option}" ${userAnswers[currentQuestionIndex] === option ? 'checked' : ''}>
                    ${option}
                `;
                optionsDiv.appendChild(label);
            });

            // Update navigation buttons
            document.getElementById('prevBtn').disabled = currentQuestionIndex === 0;
            if (currentQuestionIndex === questions.length - 1) {
                document.getElementById('nextBtn').style.display = 'none';
                document.getElementById('submitBtn').style.display = 'inline';
            } else {
                document.getElementById('nextBtn').style.display = 'inline';
                document.getElementById('submitBtn').style.display = 'none';
            }
        }

        function saveAnswer() {
            const selectedOption = document.querySelector('input[name="option"]:checked');
            userAnswers[currentQuestionIndex] = selectedOption ? selectedOption.value : null;
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                saveAnswer();
                currentQuestionIndex--;
                showQuestion();
            }
        }

        function nextQuestion() {
            if (currentQuestionIndex < questions.length - 1) {
                saveAnswer();
                currentQuestionIndex++;
                showQuestion();
            }
        }

        function submitQuiz() {
            saveAnswer();
            clearInterval(timerInterval);
            document.getElementById('questionScreen').style.display = 'none';
            document.getElementById('resultScreen').style.display = 'block';

            let score = 0;
            const resultsTable = document.getElementById('resultsTable');
            resultsTable.innerHTML = '';

            questions.forEach((question, index) => {
                const userAnswer = userAnswers[index];
                const isCorrect = userAnswer === question.correct;
                if (isCorrect) score++;

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${question.question}</td>
                    <td class="${userAnswer ? (isCorrect ? 'correct' : 'incorrect') : 'not-answered'}">
                        ${userAnswer || 'Không chọn'}
                    </td>
                    <td>${question.correct}</td>
                    <td>${question.explanation}</td>
                `;
                resultsTable.appendChild(row);
            });

            document.getElementById('score').textContent = `Điểm: ${score}/40`;
        }

        function backToStart() {
            document.getElementById('resultScreen').style.display = 'none';
            document.getElementById('startScreen').style.display = 'block';
            currentQuestionIndex = 0;
            userAnswers = new Array(questions.length).fill(null);
            timeLeft = 45 * 60;
            document.getElementById('timer').textContent = '45:00';
        }

        // Deployment Instructions:
        /*
            To deploy on GitHub Pages:
            1. Create a GitHub repository.
            2. Upload quiz1.html to the repository.
            3. Go to repository Settings > Pages.
            4. Set Source to "Deploy from a branch" and select "main" branch.
            5. Access the quiz at: https://username.github.io/repository-name/quiz1.html

            To deploy on Netlify:
            1. Sign up at netlify.com.
            2. Drag and drop quiz1.html into the Netlify dashboard or link your GitHub repository.
            3. Netlify will provide a URL, e.g., https://your-site-name.netlify.app/quiz1.html
        */
    </script>
</body>
